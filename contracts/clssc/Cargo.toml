[package]
name = "clssc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std     = { version = "1.5", features = ["stargate", "iterator"] }
cosmwasm-storage = { version = "1.5", features = ["iterator"] }
cw-storage-plus  = { version = "1.2", features = ["iterator"] }
cw20-base        = { version = "1.1", features = ["library"] }
cw20             = { version = "1.1" }
cw2              = { version = "1.1" }
schemars         = "0.8"
serde            = { version = "1.0", default-features = false, features = ["derive"] }
thiserror        = "1.0"
serde_json       = { version = "1.0" }

[dev-dependencies]
cw-multi-test = { version = "0.20" }

[profile.release]
opt-level     = 3
debug         = false
rpath         = false
lto           = true
debug-assertions = false
codegen-units = 1
panic         = "abort"
incremental   = false
overflow-checks = true
