syntax = "proto3";
package amitis.amitisdex.v1;

option go_package = "github.com/amitis-network/amitis-network/x/amitisdex/types";

// Pool represents a liquidity pool — always AMTS paired with another token
message Pool {
  uint64 id        = 1;
  string denom_a   = 2;
  string denom_b   = 3;
  string reserve_a = 4;
  string reserve_b = 5;
  string total_shares = 6;
}

// LiquidityPosition tracks an LP's share in a pool
message LiquidityPosition {
  string address = 1;
  uint64 pool_id = 2;
  string shares  = 3;
}
